<!DOCTYPE HTML>
<html>
<head>
    <title>Travel Secure</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- SWIPER CONTAINER -->
<div class="swiper">
    <div class="swiper-wrapper">
        <!-- CARD 1 -->
        <div class="swiper-slide">
            <div class="card">
                <div class="card-content">
                    <div class="image">
                        <img src="images/20251031_114556.jpg" alt="Kundai Chaatizembwa">
                    </div>
                    <div class="name-profession">
                        <span class="name">Kundai Chatiembwa</span>
                        <span class="profession">Zimbabwean guide</span>
                    </div>
                    <div class="rating">
                        <span class="stars">★★★★★</span>
                    </div>
                    <div class="btns">
                        <button><a href="KundaiTravelPage.html">Read More</a></button>
                    </div>
                </div>
            </div>
        </div>
        <!-- CARD 2 -->
        <div class="swiper-slide">
            <div class="card">
                <div class="card-content">
                    <div class="image">
                        <img src="images/IMG-20251112-WA0017.jpg"" alt="Belen">
                    </div>
                    <div class="name-profession">
                        <span class="name">Belen</span>
                        <span class="profession">Mexico guide</span>
                    </div>
                    <div class="rating">
                        <span class="stars">★★★★★</span>
                    </div>
                    <div class="btns">
                        <button><a href="BelenTravelPage.html">Read More</a></button>
                    </div>
                </div>
            </div>
        </div>
        <!-- CARD 3 -->
        <div class="swiper-slide">
            <div class="card">
                <div class="card-content">
                    <div class="image">
                        <img src="images/1dece2c8357bdd7cee3b15036344faf5.jpg" alt="Dara">
                    </div>
                    <div class="name-profession">
                        <span class="name">Dara</span>
                        <span class="profession">Adventure guide</span>
                    </div>
                    <div class="rating">
                        <span class="stars">★★★★★</span>
                    </div>
                    <div class="btns">
                        <button><a href="Dara.html">Read More</a></button>
                    </div>
                </div>
            </div>
        </div>
        <!-- CARD 4 -->
        <div class="swiper-slide">
            <div class="card">
                <div class="card-content">
                    <div class="image">
                        <img src="images/IMG-20251117-WA0004%20(1).jpg" alt="Mursal">
                    </div>
                    <div class="name-profession">
                        <span class="name">Mursal Kamizada</span>
                        <span class="profession">...Guide</span>
                    </div>
                    <div class="rating">
                        <span class="stars">★★★★★</span>
                    </div>
                    <div class="btns">
                        <button><a href="MusralTravelPage.html">Read More</a></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- SLIDER BUTTONS -->
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <!-- PAGINATION DOTS -->
    <div class="swiper-pagination"></div>
</div>
<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const swiper = new Swiper('.swiper', {
        loop: true,
        slidesPerView: 1,
        spaceBetween: 20,
        pagination: {
            el: '.swiper-pagination',
            clickable: true,
        },
        navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev',
        },
        breakpoints: {
            768: {
                slidesPerView: 2,
                spaceBetween: 30,
            },
            1024: {
                slidesPerView: 3,
                spaceBetween: 30,
            }
        }
    });
</script>
</body>
</html>
